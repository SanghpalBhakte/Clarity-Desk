name: Tests

# Runs the deterministic suite, the PWA smoke suite and the visual suite on every push to main
# and on every pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # GitHub's runners sometimes cannot reach Ubuntu's apt mirrors, which failed
      # whole runs for reasons that have nothing to do with the code. Retry, then
      # fall back to the browser alone (the runner image already carries its libraries).
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          echo "apt is unreachable: installing the browser without system packages"
          npx playwright install chromium

      - run: npm run test:photo-check

      - run: npm run test:pwa-smoke

      - run: npm run test:onboarding

      # Sign-in startup and offline sync in a real browser (fake Firebase, no network).
      - run: npm run test:sync-flows

      # Screenshots compare against the *-linux.png files; refresh them with
      # the "Refresh Linux screenshots" workflow after a deliberate UI change.
      - run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
