name: Refresh Linux screenshots

# CI runs the visual tests on Linux, where fonts render a little differently
# from a Mac, so it needs its own saved screenshots. After a deliberate UI
# change, run it on the pushed branch (gh workflow run visual-snapshots.yml
# --ref <branch>): it rewrites only the screenshots that fail CI's comparison,
# commits them to that branch and starts Tests on the new commit. Then
# `git pull` the branch. Never commits on main. The changed files are also
# kept as the "linux-screenshots" artifact for a look.

on:
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed screenshots to the branch
  actions: write    # start Tests: a push made with this token starts no workflow

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub's runners sometimes cannot reach Ubuntu's apt mirrors, which failed
      # whole runs for reasons that have nothing to do with the code. Retry, then
      # fall back to the browser alone (the runner image already carries its libraries).
      - name: Install Chromium
        run: |
          for attempt in 1 2; do
            timeout 150 npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed or hung; retrying"
            sleep 15
          done
          echo "apt is unreachable: installing the browser without system packages"
          npx playwright install chromium

      - run: npx playwright test tests/clarity-visual-verification.spec.ts --update-snapshots=changed

      - name: List changed screenshots
        run: |
          mkdir -p changed-screenshots
          git status --porcelain --untracked-files=all -- 'tests/clarity-visual-verification.spec.ts-snapshots/*-linux.png' \
            | cut -c4- | while read -r f; do cp "$f" changed-screenshots/; echo "Changed: $(basename "$f")"; done
          if [ -z "$(ls changed-screenshots)" ]; then echo "::notice::No screenshots changed; CI already passes."; fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots
          path: changed-screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the screenshots and start Tests
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- 'tests/clarity-visual-verification.spec.ts-snapshots/*-linux.png'
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: refresh the Linux screenshots"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run test.yml --ref "$GITHUB_REF_NAME"
