name: Refresh Linux screenshots

# CI runs the visual tests on Linux, where fonts render a little differently
# from a Mac, so it needs its own saved screenshots. Run this by hand
# (Actions > Refresh Linux screenshots > Run workflow, pick the branch) after
# a deliberate UI change, download the "linux-screenshots" artifact and
# commit the files into tests/clarity-visual-verification.spec.ts-snapshots/.
# It rewrites only the screenshots that fail CI's comparison, so the artifact
# holds just those (none means CI already passes). Run it on a pushed branch
# before opening the PR, so the first Tests run is green.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test tests/clarity-visual-verification.spec.ts --update-snapshots=changed

      - name: List changed screenshots
        run: |
          mkdir -p changed-screenshots
          git status --porcelain --untracked-files=all -- 'tests/clarity-visual-verification.spec.ts-snapshots/*-linux.png' \
            | cut -c4- | while read -r f; do cp "$f" changed-screenshots/; echo "Changed: $(basename "$f")"; done
          if [ -z "$(ls changed-screenshots)" ]; then echo "::notice::No screenshots changed; CI already passes."; fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-screenshots
          path: changed-screenshots/
          retention-days: 7
          if-no-files-found: ignore
