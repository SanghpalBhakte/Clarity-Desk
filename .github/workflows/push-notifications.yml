name: Background Push Notifications

# Free scheduled job (GitHub Actions cron) that evaluates each signed-in
# user's synced Firestore data against their notification preferences and
# sends due reminders via Firebase Cloud Messaging. Deliberately NOT a
# Firebase Cloud Function — that would require the Blaze (pay-as-you-go)
# billing plan; this achieves the same result at zero cost using the
# repo's own free Actions minutes. See PROJECT_MEMORY.md for the full
# architecture and setup steps.
#
# Setup required once (see PROJECT_MEMORY.md):
#   1. Add a repository secret named FIREBASE_SERVICE_ACCOUNT containing the
#      full contents of a Firebase service account JSON key (Firebase
#      Console -> Project Settings -> Service Accounts -> Generate new
#      private key). Settings -> Secrets and variables -> Actions on this repo.
#   2. Generate a VAPID Web Push key pair (Firebase Console -> Project
#      Settings -> Cloud Messaging -> Web Push certificates) and put the
#      public key in firebase-config.js (already done for the initial key).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: push-notifications
  cancel-in-progress: false

jobs:
  evaluate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/push-notifications/package-lock.json

      - name: Install dependencies
        working-directory: scripts/push-notifications
        run: npm ci --no-audit --no-fund

      - name: Run notification evaluation
        working-directory: scripts/push-notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-notifications.js
