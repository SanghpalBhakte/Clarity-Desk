name: AI models

# Checks once a day that the free AI models the scanners use are still
# offered by Gemini, Groq and OpenRouter (scripts/check-ai-models.mjs).
# Listing models uses no AI quota. A failed run emails the repo owner.
# Needs repo secrets GEMINI_API_KEY and GROQ_API_KEY; a missing one is
# skipped with a warning.

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/check-ai-models.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
