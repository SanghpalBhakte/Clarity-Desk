name: Weekly checks

# Sunday 22:00 IST (16:30 UTC): security audit, the fast architecture and
# storage checks, and the clutter checks (docs/POLISH.md) on main. On a failure it opens (or comments on) one issue
# labelled "weekly-checks"; a green week stays quiet. The Monday Claude
# routine reads that issue. Free: GitHub-hosted runner, no API keys.

on:
  schedule:
    - cron: '30 16 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # For the clutter checks (docs/POLISH.md). Same retry as live-check.yml.
      - name: Install Chromium
        run: |
          for attempt in 1 2; do
            timeout 150 npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed or hung; retrying"
            sleep 15
          done
          npx playwright install chromium

      - name: Run the checks
        id: checks
        run: |
          set +e
          : > report.md
          run() {
            name="$1"; shift
            out=$("$@" 2>&1); code=$?
            if [ $code -eq 0 ]; then echo "- ✅ $name" >> report.md
            else
              echo "- ❌ **$name**" >> report.md
              printf '\n<details><summary>%s output</summary>\n\n```\n%s\n```\n</details>\n\n' "$name" "$(echo "$out" | tail -40)" >> report.md
              echo failed=1 >> "$GITHUB_OUTPUT"
            fi
          }
          run "npm audit (high and critical)" npm audit --audit-level=high
          run "Lint (no new problems)" npm run lint
          run "Storage key list" node tests/verify_storage_keys.mjs
          run "Damaged-data guard" node tests/verify_storage_guard.mjs
          run "PWA offline copy" node tests/verify_pwa_consistency.mjs
          run "Hosting file list" node tests/verify_hosting_files.mjs
          run "ARCHITECTURE.md names" node tests/verify_docs_names.mjs
          run "Full unit suite" npm test
          run "Clutter checks (messy desk, every screen)" npx playwright test tests/polish.spec.ts --project=chromium-desktop --reporter=line
          {
            echo
            echo "Lint problems still counted in eslint-suppressions.json: $(node -e 'const s=require("./eslint-suppressions.json");let n=0;for(const f of Object.values(s))for(const r of Object.values(f))n+=r.count;console.log(n)')"
            echo "Outdated packages:"; echo '```'; npm outdated || true; echo '```'
          } >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the weekly issue
        if: steps.checks.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create weekly-checks --color B60205 --description "Weekly checks found a problem" 2>/dev/null || true
          printf '\n[Run log](%s)\n' "$RUN_URL" >> report.md
          num=$(gh issue list --label weekly-checks --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file report.md
          else gh issue create --title "Weekly checks: something failed" --label weekly-checks --body-file report.md
          fi
